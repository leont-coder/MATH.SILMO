<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TESTRA</title>
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand"><img src="icon-192.png" alt=""><h1>TESTRA</h1></div>
    <div class="dday"><span id="dday-label"></span><b id="dday">–</b></div>
  </header>

  <section class="setup" id="setup" hidden>
    <h2>저장소 연결</h2>
    <ol>
      <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 만들기</a></li>
      <li>Repository access → Only select repositories → <code id="setup-repo"></code></li>
      <li>Permissions → Contents → Read and write</li>
      <li>Generate token → 아래에 붙여 넣기</li>
    </ol>
    <input type="password" id="token" autocomplete="off" placeholder="github_pat_…" aria-label="접근 토큰">
    <div><button class="btn primary" type="button" id="connect">연결</button></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="화면" hidden>
    <a href="#wrong" id="tab-wrong">오답</a>
    <a href="#exams" id="tab-exams">실모</a>
  </nav>

  <div class="notice" id="status" role="status" hidden></div>

  <section class="view" id="view-wrong" hidden>
    <label class="drop" id="drop">
      <span class="plus" aria-hidden="true">＋</span><span>사진 추가</span>
      <input type="file" id="file" accept="image/*" multiple>
    </label>
    <div class="rowhead">
      <h2 id="week-title"></h2>
      <span class="count" id="week-count"></span>
    </div>
    <div class="cards" id="wrong-list"></div>
    <div class="empty" id="wrong-empty" hidden>틀린 문제 사진을 추가하세요</div>
  </section>

  <section class="view" id="view-exams" hidden>
    <div id="exam-list" style="display:flex;flex-direction:column;gap:18px"></div>
    <div class="empty" id="exam-empty" hidden></div>
  </section>

  <footer class="foot" id="foot" hidden>
    <button class="linkbtn" type="button" id="refresh">새로 고침</button>
    <button class="linkbtn" type="button" id="logout">연결 해제</button>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
